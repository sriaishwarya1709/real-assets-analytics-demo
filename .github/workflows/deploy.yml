name: Deploy existing Azure web app
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/PortfolioLens.Tests --configuration Release
      - run: dotnet publish src/PortfolioLens/PortfolioLens.csproj -c Release -o artifacts/publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/publish
      - name: Verify health
        env:
          WEB_APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${WEB_APP_NAME}.azurewebsites.net/health"
